[package]
name = "ss_rap_settlement"
version = "0.1.0"
edition = "2021"
description = "SS-RAP v2 Phase C: L1 settlement (Groth16 over BN254), sequencer and payment module"

[dependencies]
ss_rap_v2 = { path = ".." }
ark-bn254 = "0.5"
ark-ec = { version = "0.5", features = ["parallel"] }
ark-ff = { version = "0.5", features = ["parallel"] }
ark-groth16 = { version = "0.5", features = ["parallel"] }
ark-relations = "0.5"
ark-snark = "0.5"
ark-std = { version = "0.5", features = ["parallel"] }
rayon = "1.10"
ark-serialize = "0.5"
ark-r1cs-std = "0.5"
ark-crypto-primitives = { version = "0.5", default-features = false, features = ["sponge", "r1cs"] }
tiny-keccak = { version = "2", features = ["keccak"] }
k256 = { version = "0.13", features = ["ecdsa"] }
num-bigint = "0.4"
rand_chacha = "0.3"
blake3 = "1.5"
ss_rap_p3 = { path = "../p3" }
p3-bn254 = "=0.9.0-rc.2"
p3-field = "=0.9.0-rc.2"
p3-baby-bear = "=0.9.0-rc.2"
p3-commit = "=0.9.0-rc.2"
p3-matrix = "=0.9.0-rc.2"
p3-uni-stark = "=0.9.0-rc.2"
p3-util = "=0.9.0-rc.2"
p3-symmetric = "=0.9.0-rc.2"
num-bigint-05 = { package = "num-bigint", version = "0.5" }
p3-air = "=0.9.0-rc.2"
p3-batch-stark = "=0.9.0-rc.2"
p3-lookup = "=0.9.0-rc.2"
c-kzg = "2"
sha2 = "0.10"
