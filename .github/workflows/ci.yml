name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust tests + benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --all-targets --locked
      - name: Tests (core + settlement)
        run: cargo test --release --locked --workspace
      - name: Phase C end-to-end (writes Solidity verifier + fixture; must be up to date)
        run: |
          cargo run --release --locked -p ss_rap_settlement --example export_fixture | tee e2e.txt
          git diff --exit-code -- contracts/Groth16Verifier.sol test/SettlementFixture.sol
      - name: R8 settlement circuit (state STARK verified inside Groth16; writes verifier + fixture)
        run: |
          cargo run --release --locked -p ss_rap_settlement --example export_stark_fixture | tee r8.txt
          git diff --exit-code -- contracts/StarkWrapperVerifier.sol test/StarkSettlementFixture.sol
      - name: P4b Plonky3 settlement circuit (5-lane Plonky3 STARK verified inside Groth16; writes verifier + fixture)
        run: |
          cargo run --release --locked -p ss_rap_settlement --example export_p3_fixture | tee p4b.txt
          git diff --exit-code -- contracts/P3WrapperVerifier.sol test/P3SettlementFixture.sol
      - name: PDF strategy benchmark
        run: cargo run --release --locked --example bench_pdf_strategy -- 65536 | tee bench_pdf_strategy.txt
      - name: End-to-end STARK benchmark (5 lanes x 1024 uint256 MULMOD)
        run: cargo run --release --locked --example bench_stark_mulmod -- 10 | tee bench_stark_mulmod.txt
      - name: Plonky3 state lanes (1000 transfers)
        run: cargo run --release --locked -p ss_rap_p3 --example bench_p3_state -- 1000 | tee bench_p3_state.txt
      - name: Benchmark summary
        run: |
          {
            echo '## Phase C end-to-end'; echo '```'; cat e2e.txt; echo '```'
            echo '## R8 settlement circuit'; echo '```'; cat r8.txt; echo '```'
            echo '## P4b Plonky3 settlement circuit'; echo '```'; cat p4b.txt; echo '```'
            echo '## bench_pdf_strategy'; echo '```'; cat bench_pdf_strategy.txt; echo '```'
            echo '## bench_stark_mulmod'; echo '```'; cat bench_stark_mulmod.txt; echo '```'
            echo '## bench_p3_state'; echo '```'; cat bench_p3_state.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  solidity:
    name: Solidity build + tests (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build contracts
        run: forge build --sizes
      - name: Settlement tests (proof from the Rust pipeline)
        run: forge test -vv --gas-report | tee forge.txt
      - name: Summary
        run: |
          { echo '## forge test'; echo '```'; cat forge.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
