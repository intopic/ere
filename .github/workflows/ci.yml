name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust tests + benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --all-targets --locked
      - name: Tests
        run: cargo test --release --locked
      - name: PDF strategy benchmark
        run: cargo run --release --locked --example bench_pdf_strategy -- 65536 | tee bench_pdf_strategy.txt
      - name: End-to-end STARK benchmark (1024 x uint256 MULMOD)
        run: cargo run --release --locked --example bench_stark_mulmod -- 10 | tee bench_stark_mulmod.txt
      - name: RNS-256 benchmark
        run: cargo run --release --locked --example bench_rns256 | tee bench_rns256.txt
      - name: Benchmark summary
        run: |
          {
            echo '## bench_pdf_strategy'; echo '```'; cat bench_pdf_strategy.txt; echo '```'
            echo '## bench_stark_mulmod'; echo '```'; cat bench_stark_mulmod.txt; echo '```'
            echo '## bench_rns256'; echo '```'; cat bench_rns256.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  solidity:
    name: Solidity compile (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build contract
        run: forge build --sizes
